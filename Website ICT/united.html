<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manchester United 25/26 | FootyShirts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">FOOTYSHIRTS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="products.html">All Kits</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="section">
        <div class="container">
            <div class="product-layout">
                <section class="product-gallery glass-panel">
                    <img src="https://assets.adidas.com/images/w_600,f_auto,q_auto/341ec36583354390854e7ad4fd2a02dd_9366/Manchester_United_25-26_Home_Jersey_Red_JI7428_01_laydown.jpg" class="product-image" alt="Manchester United 25/26 home jersey">
                </section>

                <section class="product-summary glass-panel">
                    <p class="product-highlight">new one</p>
                    <h1>Manchester United Home Jersey</h1>
                    <p class="lead">This one is simple and red.</p>
                    <p class="price-tag">&pound;100.00</p>

                    <div class="detail-list">
                        <span>Red home shirt</span>
                        <span>Normal fit</span>
                        <span>25/26 season</span>
                    </div>

                    <div>
                        <h2 class="h5 fw-bold mb-3">Pick a Size</h2>
                        <div class="size-selector">
                            <div class="size-option">
                                <input type="radio" name="size-united" id="united-s" value="S">
                                <label for="united-s">S</label>
                            </div>
                            <div class="size-option">
                                <input type="radio" name="size-united" id="united-m" value="M" checked>
                                <label for="united-m">M</label>
                            </div>
                            <div class="size-option">
                                <input type="radio" name="size-united" id="united-l" value="L">
                                <label for="united-l">L</label>
                            </div>
                            <div class="size-option">
                                <input type="radio" name="size-united" id="united-xl" value="XL">
                                <label for="united-xl">XL</label>
                            </div>
                        </div>
                    </div>

                    <div class="quantity-row">
                        <div class="flex-grow-1">
                            <label class="form-label fw-semibold" for="qty-united">Quantity</label>
                            <input id="qty-united" class="form-control" type="number" min="1" value="1">
                        </div>
                    </div>

                    <div class="product-actions">
                        <button class="btn btn-brand add-to-cart-btn" data-product="Manchester United Home Jersey" data-size-group="size-united" data-quantity-input="qty-united">Add to Cart</button>
                        <a href="products.html" class="btn btn-secondary-soft">Back</a>
                    </div>

                    <p class="cart-message" aria-live="polite"></p>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p class="mb-2"><strong>FootyShirts</strong> | Simple football shirt site.</p>
            <div class="footer-links mb-3">
                <a href="index.html">Home</a>
                <a href="products.html">All Kits</a>
            </div>
            <p class="mb-0">&copy; 2026 FootyShirts.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
